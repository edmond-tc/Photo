<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Générateur de clés</title>
<style>:root{--bg:#f3f6fc;--fg:#0b1230;--card:#fff;--line:#dfe5f2;--acc:#1f8f86}
@media (prefers-color-scheme:dark){:root{--bg:#0b1230;--fg:#eef2ff;--card:#151d40;--line:#26305c}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,Arial,sans-serif;padding:16px}
.c{max-width:520px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-left:4px solid #f2b632;border-radius:16px;padding:16px}
h1{font-size:22px;margin:0 0 6px}label{display:block;font-weight:700;margin:14px 0 6px}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border-radius:12px;border:1px solid var(--line);background:transparent;color:inherit;font:inherit}
button{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px 16px;font:700 16px system-ui;margin:10px 8px 0 0}.s{background:#5b6b8c}.m{font-size:14px;opacity:.8}#out{word-break:break-all;font-family:monospace;font-size:13px}</style></head><body><div class="c">
<h1>Clés Studio Réseaux</h1><div class="m">Outil privé du vendeur. Ne le partage jamais, ni ta clé privée.</div>
<div id="pk"><label>Ta clé privée (fichier cle-privee-studio-reseaux.json)</label><input type="file" id="f" accept=".json,application/json"><div class="m" id="pke"></div></div>
<label for="code">Code appareil du client</label><input id="code" placeholder="ABCDE-FGHJK" autocapitalize="characters">
<label for="mois">Durée</label><select id="mois"><option value="1">1 mois (950 F)</option><option value="2">2 mois</option><option value="3">3 mois</option><option value="6">6 mois</option><option value="12">12 mois</option></select>
<label for="tel">Numéro WhatsApp du client (facultatif, pour l'envoi)</label><input id="tel" placeholder="229xxxxxxxx" inputmode="tel">
<button id="go">Fabriquer la clé</button>
<label>Clé à envoyer</label><div id="out" class="m">—</div><div id="fin" class="m"></div>
<button id="cp" class="s">Copier</button><button id="wa" class="s">Envoyer sur WhatsApp</button><button id="oubli" class="s">Oublier ma clé privée</button></div>
<script>
const $=i=>document.getElementById(i);let K=null;
const b64u=a=>btoa(String.fromCharCode(...new Uint8Array(a))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function charger(j){K=await crypto.subtle.importKey('jwk',j,{name:'ECDSA',namedCurve:'P-256'},false,['sign']);$('pke').textContent='Clé privée chargée.'}
(async()=>{try{const j=localStorage.getItem('srPriv');if(j)await charger(JSON.parse(j))}catch(e){$('pke').textContent='Clé enregistrée illisible : recharge le fichier.'}})();
$('f').onchange=async e=>{try{const t=await e.target.files[0].text(),j=JSON.parse(t);await charger(j);try{localStorage.setItem('srPriv',t)}catch(x){}}catch(x){$('pke').textContent='Fichier non valide.'}};
$('go').onclick=async()=>{if(!K){alert('Charge d\'abord ta clé privée.');return}const code=$('code').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length!==10){alert('Le code appareil a 10 caractères (ex. ABCDE-FGHJK).');return}
 const c=code.slice(0,5)+'-'+code.slice(5),d=new Date();d.setMonth(d.getMonth()+(+$('mois').value));const fin=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
 const pay=new TextEncoder().encode('v1|'+c+'|'+fin+'|M'),sig=await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},K,pay);
 $('out').textContent=b64u(pay)+'.'+b64u(sig);$('fin').textContent='Valable jusqu\'au '+fin.slice(6)+'/'+fin.slice(4,6)+'/'+fin.slice(0,4)+' pour le téléphone '+c+'.'};
$('cp').onclick=()=>{navigator.clipboard.writeText($('out').textContent).then(()=>alert('Copiée.'))};
$('wa').onclick=()=>{const t=$('tel').value.replace(/\D/g,'');const m='Merci pour ton abonnement à Studio Réseaux. Ta clé (à coller dans l\'application, carte « Abonnement ») :\n'+$('out').textContent;location.href='https://wa.me/'+t+'?text='+encodeURIComponent(m)};
$('oubli').onclick=()=>{localStorage.removeItem('srPriv');K=null;$('pke').textContent='Clé privée oubliée sur cet appareil.'};
</script></body></html>
