name: Build Android (envoyeur)

on:
  push:
    # « essai/… » et « main-a-main » : APK d'essai seulement (publication
    # GitHub à part), jamais sur la page d'installation des clients.
    branches: [main, main-a-main, "essai/**"]
    paths:
      - "android/**"
      - "client-web/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # Clé de publication secrète (voir android/app/build.gradle.kts). Sans
      # les secrets, l'APK est signé avec la clé d'essai, comme avant.
      - name: Préparer la clé de publication
        env:
          CLE_B64: ${{ secrets.ENVOYEUR_KEYSTORE_B64 }}
        run: |
          if [ -n "$CLE_B64" ]; then
            echo "$CLE_B64" | base64 -d > "$RUNNER_TEMP/envoyeur-publication.jks"
            echo "ENVOYEUR_KEYSTORE=$RUNNER_TEMP/envoyeur-publication.jks" >> "$GITHUB_ENV"
            echo "Clé de publication utilisée."
          else
            echo "::warning::Secrets ENVOYEUR_KEYSTORE_B64 absents : APK signé avec la clé d'ESSAI."
          fi

      - name: Compiler l'envoyeur (APK)
        env:
          ENVOYEUR_KEYSTORE_MDP: ${{ secrets.ENVOYEUR_KEYSTORE_MDP }}
        run: gradle -p android assembleRelease --no-daemon

      # Même stockage que l'installateur Windows : la page publique
      # /telecharger (admin/src/index.js, CLE_APK) sert l'APK depuis là.
      - name: Installer Node.js 22 (requis par wrangler)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Préparer l'APK
        shell: bash
        run: |
          mkdir -p sortie
          cp android/app/build/outputs/apk/release/app-release.apk sortie/EnvoyeurKiosque.apk
          (cd sortie && sha256sum EnvoyeurKiosque.apk > empreinte-sha256-envoyeur.txt)
          # Lu par la page de téléchargement (CLE_VERSION_APK, admin/src/index.js).
          grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts | tr -d '\n' > sortie/version-envoyeur.txt

      - name: Publier l'APK sur la page de téléchargement
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          cd admin
          npm ci
          for nom in EnvoyeurKiosque.apk empreinte-sha256-envoyeur.txt version-envoyeur.txt; do
            npx wrangler r2 object put "photocopie-telechargements/$nom" --file="../sortie/$nom" --remote
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publier l'APK (secours GitHub)
        continue-on-error: true
        shell: bash
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          tag="envoyeur-v$version"
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            tag="envoyeur-essai-${GITHUB_REF_NAME//\//-}"
          fi
          # --latest=false : la « dernière version » du dépôt doit rester
          # celle du logiciel du PC.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" sortie/* --clobber
          else
            gh release create "$tag" sortie/* --title "Envoyeur Kiosque $version (essai)" \
              --notes "Application Android d'essai : envoie les documents au PC du kiosque, sans internet." \
              --prerelease --latest=false
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
