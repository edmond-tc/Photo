name: Build Android (envoyeur)

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Compiler l'envoyeur (APK)
        run: gradle -p android assembleRelease --no-daemon

      - name: Publier l'APK
        shell: bash
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          tag="envoyeur-v$version"
          mkdir -p sortie
          cp android/app/build/outputs/apk/release/app-release.apk sortie/EnvoyeurKiosque.apk
          (cd sortie && sha256sum EnvoyeurKiosque.apk > empreinte-sha256-envoyeur.txt)
          # --latest=false : la « dernière version » du dépôt doit rester
          # celle du logiciel du PC.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" sortie/* --clobber
          else
            gh release create "$tag" sortie/* --title "Envoyeur Kiosque $version (essai)" \
              --notes "Application Android d'essai : envoie les documents au PC du kiosque, sans internet." \
              --prerelease --latest=false
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
