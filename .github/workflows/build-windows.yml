name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances npm
        run: npm ci

      - name: Compiler l'application Windows
        run: npm run tauri build

      - name: Test de démarrage sur un vrai Windows (garde-fou automatique)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "src-tauri/target/release" -Filter "photocopie-benin.exe" -File | Select-Object -First 1
          if (-not $exe) {
            Write-Error "Exécutable introuvable après compilation."
            exit 1
          }
          $proc = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 8
          if ($proc.HasExited) {
            Write-Error "L'application a quitté toute seule dans les 8 secondes (code $($proc.ExitCode)) — plantage probable au démarrage. Ne pas distribuer ce build."
            exit 1
          }
          Write-Host "OK : l'application tourne toujours après 8 secondes sur ce Windows réel."
          Stop-Process -Id $proc.Id -Force

      # Faute de certificat de signature (payant), l'empreinte SHA-256 est le
      # moyen gratuit de prouver qu'un installateur n'a pas été remplacé en
      # route. Le gérant la compare avec `certutil -hashfile fichier.exe
      # SHA256` avant d'installer.
      # Deux installateurs sont publiés, et la différence n'est pas cosmétique.
      #
      # Le complet embarque le moteur d'affichage de Windows (WebView2), ce qui
      # le fait peser plus de 200 Mo mais le rend installable sur un PC de
      # boutique qui n'a jamais vu internet — la raison d'être du projet.
      #
      # Le léger ne l'embarque pas : quelques dizaines de Mo, pour les PC qui
      # l'ont déjà, c'est-à-dire ceux où l'application tourne déjà. Sur le
      # terrain la connexion se paye au mégaoctet, et retélécharger 200 Mo à
      # chaque correction est souvent impossible. C'est cette version-là qui
      # sert aux mises à jour.
      - name: Préparer les deux installateurs
        shell: pwsh
        run: |
          $sortie = "installateurs"
          New-Item -ItemType Directory -Force -Path $sortie | Out-Null

          $complet = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File | Select-Object -First 1
          if (-not $complet) { Write-Error "Installateur complet introuvable."; exit 1 }
          Copy-Item $complet.FullName "$sortie/GestionPhotocopie-Installateur.exe"

          # Le binaire est déjà compilé : cette seconde passe ne refait que
          # l'empaquetage, elle ne recompile pas le Rust.
          #
          # La surcharge passe par un FICHIER, pas par du JSON en ligne de
          # commande : entre PowerShell, npm et cmd, les guillemets d'un JSON
          # écrit à la main se font abîmer en route sous Windows, l'option
          # serait silencieusement ignorée, et on publierait 200 Mo sous le
          # nom "mise à jour". Le garde-fou de taille plus bas rattraperait le
          # coup, mais autant ne pas créer le problème.
          $confLeger = Join-Path (Get-Location).Path "tauri.leger.json"
          Set-Content -Path $confLeger -Encoding utf8 -Value '{"bundle":{"windows":{"webviewInstallMode":{"type":"downloadBootstrapper"}}}}'
          npm run tauri build -- --config $confLeger
          Remove-Item $confLeger -Force

          $leger = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File | Select-Object -First 1
          if (-not $leger) { Write-Error "Installateur léger introuvable."; exit 1 }
          Copy-Item $leger.FullName "$sortie/GestionPhotocopie-MiseAJour.exe"

          foreach ($paire in @(
            @{ Fichier = "GestionPhotocopie-Installateur.exe"; Empreinte = "empreinte-sha256.txt" },
            @{ Fichier = "GestionPhotocopie-MiseAJour.exe";    Empreinte = "empreinte-sha256-mise-a-jour.txt" }
          )) {
            $chemin = "$sortie/$($paire.Fichier)"
            $hash = (Get-FileHash -Path $chemin -Algorithm SHA256).Hash.ToLower()
            Set-Content -Path "$sortie/$($paire.Empreinte)" -Value $hash -NoNewline
            $mo = [math]::Round((Get-Item $chemin).Length / 1MB, 1)
            Write-Host "$($paire.Fichier) : $mo Mo — SHA-256 $hash"
          }

          # Garde-fou : si la version légère n'est pas nettement plus petite,
          # c'est que la configuration n'a pas été prise en compte — et publier
          # 200 Mo sous le nom "mise à jour" tromperait le gérant sur ce qu'il
          # va payer en données.
          $tailleComplet = (Get-Item "$sortie/GestionPhotocopie-Installateur.exe").Length
          $tailleLeger = (Get-Item "$sortie/GestionPhotocopie-MiseAJour.exe").Length
          if ($tailleLeger -ge $tailleComplet / 2) {
            Write-Error "La version légère ($tailleLeger octets) n'est pas plus petite que la moitié de la complète ($tailleComplet octets) : le moteur d'affichage y est probablement encore embarqué."
            exit 1
          }

      # Le lien public /telecharger (page Cloudflare) sert le fichier depuis
      # ce stockage R2, pas depuis GitHub — c'est donc lui, et pas le dépôt
      # d'artefacts CI ci-dessous, qui alimente ce qu'Edmond télécharge sur
      # le terrain. Nom de fichier identique à CLE_INSTALLATEUR/CLE_EMPREINTE
      # dans admin/src/index.js : la page les cherche par ce nom exact.
      # wrangler exige Node ≥22, alors que le reste de ce build utilise Node
      # 20 (contrainte de la compilation Tauri) — sans ce changement de
      # version juste avant cette étape, wrangler refuse de démarrer.
      - name: Installer Node.js 22 (requis par wrangler)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publier l'installateur sur le lien public de téléchargement
        shell: pwsh
        run: |
          $racine = (Get-Location).Path
          Push-Location admin
          npm ci
          foreach ($nom in @(
            "GestionPhotocopie-Installateur.exe",
            "GestionPhotocopie-MiseAJour.exe",
            "empreinte-sha256.txt",
            "empreinte-sha256-mise-a-jour.txt"
          )) {
            npx wrangler r2 object put "photocopie-telechargements/$nom" --file="$racine/installateurs/$nom" --remote
          }
          Pop-Location
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 14 jours : largement assez pour aller chercher la dernière version en
      # secours si besoin. Le quota de stockage GitHub (~400 Mo par build)
      # sature parfois lors d'une journée de terrain chargée — ce n'est plus
      # bloquant depuis que la publication ci-dessus ne dépend pas de lui.
      - name: Publier aussi sur GitHub (secours, sans bloquer si le quota est plein)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: photocopie-benin-windows
          path: |
            installateurs/*
          if-no-files-found: error
          retention-days: 14

      - name: Publier l'outil de génération de licence (secours)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: generer-licence-windows
          path: src-tauri/target/release/generer-licence.exe
          if-no-files-found: error
          retention-days: 14
