name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances npm
        run: npm ci

      - name: Compiler l'application Windows
        run: npm run tauri build

      - name: Test de démarrage sur un vrai Windows (garde-fou automatique)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "src-tauri/target/release" -Filter "photocopie-benin.exe" -File | Select-Object -First 1
          if (-not $exe) {
            Write-Error "Exécutable introuvable après compilation."
            exit 1
          }
          $proc = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 8
          if ($proc.HasExited) {
            Write-Error "L'application a quitté toute seule dans les 8 secondes (code $($proc.ExitCode)) — plantage probable au démarrage. Ne pas distribuer ce build."
            exit 1
          }
          Write-Host "OK : l'application tourne toujours après 8 secondes sur ce Windows réel."
          Stop-Process -Id $proc.Id -Force

      # Faute de certificat de signature (payant), l'empreinte SHA-256 est le
      # moyen gratuit de prouver qu'un installateur n'a pas été remplacé en
      # route. Le gérant la compare avec `certutil -hashfile fichier.exe
      # SHA256` avant d'installer.
      - name: Calculer l'empreinte de l'installateur
        shell: pwsh
        run: |
          $installateur = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File | Select-Object -First 1
          if (-not $installateur) { Write-Error "Installateur introuvable."; exit 1 }
          $empreinte = (Get-FileHash -Path $installateur.FullName -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "src-tauri/target/release/bundle/nsis/empreinte-sha256.txt" -Value $empreinte -NoNewline
          Write-Host "SHA-256 de l'installateur : $empreinte"

      # 14 jours : largement assez pour aller chercher la dernière version, et
      # ça évite de saturer le quota de stockage GitHub (chaque build ~400 Mo)
      # à force d'itérer, comme c'est arrivé un jour de terrain chargé.
      - name: Publier l'exécutable (.exe / installateurs)
        uses: actions/upload-artifact@v4
        with:
          name: photocopie-benin-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/empreinte-sha256.txt
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

      - name: Publier l'outil de génération de licence
        uses: actions/upload-artifact@v4
        with:
          name: generer-licence-windows
          path: src-tauri/target/release/generer-licence.exe
          if-no-files-found: error
          retention-days: 14
