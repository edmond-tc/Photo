name: Deploy Admin

on:
  push:
    branches: [main]
    # La page du client est servie aussi par le relais Internet.
    paths: ["admin/**", "client-web/**", ".github/workflows/deploy-admin.yml"]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22+ : la dépendance wrangler@4 du dossier admin (utilisée par
      # l'étape de migration ci-dessous) refuse de démarrer sur Node 20.
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: admin
        run: npm ci

      # Crée les tables si elles n'existent pas encore (CREATE TABLE IF NOT
      # EXISTS) : sans danger à rejouer à chaque déploiement, et ça évite
      # d'avoir à s'en souvenir lors de la toute première mise en service.
      # Chaque fichier de migrations/ doit être listé ici : contrairement à
      # "wrangler d1 migrations apply", cette commande n'exécute qu'un seul
      # fichier à la fois et ne découvre pas les nouveaux tout seule.
      - name: Appliquer le schéma de la base D1
        working-directory: admin
        run: |
          npx wrangler d1 execute photocopie-admin --remote --file=./migrations/0001_init.sql
          npx wrangler d1 execute photocopie-admin --remote --file=./migrations/0002_codes_installation.sql
          npx wrangler d1 execute photocopie-admin --remote --file=./migrations/0003_decouvrir.sql
          npx wrangler d1 execute photocopie-admin --remote --file=./migrations/0004_relais.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Le déploiement ne touche qu'au code. Le mot de passe admin et le
      # secret de licence restent définis une seule fois, côté Cloudflare
      # (`npx wrangler secret put ADMIN_PASSWORD`), et n'ont donc pas besoin
      # d'exister aussi dans GitHub : moins d'endroits détiennent le secret
      # qui signe les licences, mieux c'est.
      #
      # Auparavant cette étape renvoyait ces deux secrets à chaque
      # déploiement, et échouait avant même d'avoir déployé quoi que ce soit
      # quand ils n'étaient pas définis dans GitHub — ce qui a fait échouer
      # la totalité des déploiements depuis la création de ce fichier.
      - name: Déployer le Worker sur Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: admin

      # Le site public et le relais Internet (admin/site/), sous leur propre
      # adresse : photocopie-benin.atinzed2.workers.dev. Même base, même
      # stockage ; rien du tableau de bord n'y est exposé.
      # Lancé directement (et non par wrangler-action) pour que la raison
      # d'un échec remonte en clair dans les annotations de l'exécution.
      - name: Déployer le site public et le relais Internet
        working-directory: admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if ! npx wrangler deploy -c wrangler.site.toml 2>&1 | tee deploiement.log; then
            sed 's/\x1b\[[0-9;]*m//g' deploiement.log | grep -iE 'error|erreur|✘|fail|code: [0-9]|warn' | head -9 | while IFS= read -r ligne; do echo "::error::$ligne"; done
            exit 1
          fi
