name: Traductions complètes

# Chaque texte français affiché (page du client, logiciel du gérant) doit
# avoir sa traduction anglaise : un texte ajouté sans traduction est signalé
# ici, avec la liste de ce qui manque.
on:
  push:
    paths:
      - "client-web/**"
      - "src/**"
      - "scripts/langue/**"
      - ".github/workflows/verifier-langues.yml"
  workflow_dispatch: {}

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g typescript@5.6.3
      - name: Page du client
        run: node scripts/langue/verifier.mjs client-web/index.html client-web/langue-en.json
      - name: Logiciel du gérant
        run: node scripts/langue/verifier.mjs src/index.html src/main.js src/langue-en.json
