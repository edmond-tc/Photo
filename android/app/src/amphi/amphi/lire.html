<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#16306f">
<title>Document</title>
<style>
  :root { --bleu: #2b579a; --nuit: #16306f; --fond: #eef1f7; --discret: #5d6475; --police: "Segoe UI", Roboto, Arial, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fond); font: 14px/1.45 var(--police); color: #1f2430; }
  .barre { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--nuit); color: #fff; }
  .barre a, .barre button { flex: none; color: #fff; background: rgba(255,255,255,.15); border: 0; border-radius: 10px; padding: 8px 12px; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
  .barre button { background: #fff; color: var(--nuit); }
  .barre .titre { flex: 1; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .contenu { max-width: 900px; margin: 0 auto; padding: 12px 8px 40px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .page { width: 100%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.12); min-height: 200px; position: relative; }
  .page canvas { display: block; width: 100%; height: auto; }
  .page span { position: absolute; right: 8px; bottom: 6px; font-size: .75rem; color: var(--discret); background: rgba(255,255,255,.85); padding: 0 6px; border-radius: 6px; }
  img.media, video.media { max-width: 100%; border-radius: 10px; background: #000; }
  audio { width: 100%; margin-top: 30px; }
  .message { background: #fff; border-radius: 14px; padding: 18px; text-align: center; margin-top: 20px; max-width: 520px; }
  .message p + p { margin-top: 8px; color: var(--discret); font-size: .92rem; }
  .gros { display: inline-block; margin-top: 14px; padding: 12px 18px; border-radius: 12px; background: var(--bleu); color: #fff; font-weight: 700; text-decoration: none; border: 0; font: inherit; cursor: pointer; }
  .chargement { color: var(--discret); margin-top: 30px; }
  .chrono { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; align-items: center; gap: 10px; padding: 10px max(12px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); background: var(--nuit); color: #fff; font-weight: 700; }
  .chrono .temps { font: 800 1.3rem "Roboto Mono", monospace; flex: 1; }
  .chrono button, .chrono a { border: 0; border-radius: 10px; padding: 8px 12px; background: #fff; color: var(--nuit); font: inherit; text-decoration: none; cursor: pointer; }
  .chrono.fini { background: #b42318; }
  [hidden] { display: none !important; }
  .toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: #1f2430; color: #fff; padding: 10px 16px; border-radius: 999px; font-weight: 600; display: none; max-width: 92%; text-align: center; }
</style>
</head>
<body>
<div class="barre">
  <a href="/" id="retour">←</a>
  <span class="titre" id="titre">Document</span>
  <button type="button" id="enregistrer">💾 Enregistrer</button>
</div>
<div class="contenu" id="contenu"><p class="chargement">Ouverture…</p></div>
<div class="toast" id="toast"></div>
<div class="chrono" id="chrono" hidden><span class="temps" id="chrono-temps"></span><span id="chrono-texte"></span><button type="button" id="chrono-fin">Terminer</button></div>
<script>
(function () {
  "use strict";
  var q = new URLSearchParams(location.search);
  var id = q.get("id") || "", nom = q.get("nom") || "document", type = q.get("type") || "application/octet-stream", taille = +q.get("taille") || 0;
  var code = (q.get("code") || "").replace(/\D/g, "");
  // Fichier de la bibliothèque, ou fichier partagé par un camarade (code à 4 chiffres).
  var rang = parseInt(q.get("i") || "0", 10) || 0;
  var adresse = code ? "/partage/" + code + "/f" + (rang ? "?i=" + rang : "") : "/f/" + encodeURIComponent(id) + "?nom=" + encodeURIComponent(nom) + "&type=" + encodeURIComponent(type);
  var zone = document.getElementById("contenu");
  document.getElementById("titre").textContent = nom;
  document.title = nom;
  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
  function toast(t) { var b = document.getElementById("toast"); b.textContent = t; b.style.display = "block"; clearTimeout(toast.m); toast.m = setTimeout(function () { b.style.display = "none"; }, 3500); }
  var ext = nom.split(".").pop().toLowerCase();

  // Épreuve blanche : chronomètre de la vraie durée, gardé même si la page se recharge.
  var duree = Math.min(300, Math.max(10, parseInt(q.get("blanche") || "0", 10) || 0));
  if (q.get("blanche") && id) {
    var cle = "amphi-blanche-" + id, debut = 0;
    try { debut = +localStorage.getItem(cle) || 0; } catch (e) {}
    if (!debut || Date.now() - debut > (duree + 60) * 60000) { debut = Date.now(); try { localStorage.setItem(cle, String(debut)); } catch (e) {} }
    var ch = document.getElementById("chrono"), fini = false;
    ch.hidden = false; zone.style.paddingBottom = "80px";
    var corriges = "/#doc-" + id;
    var deux = function (n) { return (n < 10 ? "0" : "") + n; };
    var arreter = function (texte) {
      fini = true; clearInterval(tic); ch.className = "chrono fini";
      document.getElementById("chrono-temps").textContent = texte;
      var b = document.getElementById("chrono-fin"), a = document.createElement("a");
      a.href = corriges; a.textContent = "📝 Voir les corrigés"; b.replaceWith(a);
      document.getElementById("chrono-texte").textContent = "";
      try { localStorage.removeItem(cle); } catch (e) {}
    };
    var tic = setInterval(function () {
      var reste = Math.round((debut + duree * 60000 - Date.now()) / 1000);
      if (reste <= 0) { if (navigator.vibrate) navigator.vibrate([400, 200, 400]); arreter("⏰ Temps écoulé ! Posez le stylo."); return; }
      document.getElementById("chrono-temps").textContent = "⏱ " + Math.floor(reste / 3600) + ":" + deux(Math.floor(reste % 3600 / 60)) + ":" + deux(reste % 60);
      document.getElementById("chrono-texte").textContent = "Épreuve blanche";
    }, 1000);
    document.getElementById("chrono-fin").onclick = function () {
      if (fini || !confirm("Terminer l'épreuve blanche maintenant ?")) return;
      var m = Math.max(1, Math.round((Date.now() - debut) / 60000));
      arreter("✅ Terminé en " + (m >= 60 ? Math.floor(m / 60) + " h " + deux(m % 60) : m + " min"));
    };
  }

  // Enregistrer dans le téléphone sans passer par le téléchargement « non
  // sécurisé » de Chrome : le fichier est lu dans la page, puis remis au
  // téléphone. Au-delà de 60 Mo (vidéos), lien direct.
  document.getElementById("enregistrer").onclick = function () {
    // Dans l'application « Amphi » : enregistré directement dans Téléchargements.
    if (window.AmphiApp) { window.AmphiApp.telecharger(new URL(adresse, location.href).href, nom, type); toast("Téléchargement…"); return; }
    if (taille > 60e6) { location.href = adresse + (adresse.indexOf("?") < 0 ? "?" : "&") + "dl=1"; return; }
    toast("Préparation…");
    fetch(adresse).then(function (r) { if (!r.ok) throw new Error(); return r.blob(); }).then(function (b) {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(b);
      a.download = nom;
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 60000);
      toast("Enregistré dans Téléchargements ✓ (si le téléphone demande, choisissez « Conserver »)");
    }).catch(function () { location.href = adresse + (adresse.indexOf("?") < 0 ? "?" : "&") + "dl=1"; });
  };

  function nonLisible() {
    zone.textContent = "";
    var m = el("div", "message");
    m.appendChild(el("p", null, "Ce type de document (" + ext.toUpperCase() + ") ne s'affiche pas dans la page."));
    m.appendChild(el("p", null, "Enregistrez-le, puis ouvrez-le avec l'application qui convient (Word, WPS Office, etc.)."));
    var b = el("button", "gros", "💾 Enregistrer le document");
    b.onclick = function () { document.getElementById("enregistrer").click(); };
    m.appendChild(b);
    zone.appendChild(m);
  }

  if (/^image\//.test(type)) {
    zone.textContent = "";
    var i = el("img", "media"); i.src = adresse; i.alt = nom; zone.appendChild(i);
  } else if (/^video\//.test(type)) {
    zone.textContent = "";
    var v = el("video", "media"); v.src = adresse; v.controls = true; v.playsInline = true; v.preload = "metadata"; zone.appendChild(v);
  } else if (/^audio\//.test(type)) {
    zone.textContent = "";
    var a = el("audio"); a.src = adresse; a.controls = true; zone.appendChild(a);
  } else if (ext === "pdf" || type === "application/pdf") {
    var s = document.createElement("script");
    s.src = "/lib/pdf.min.js";
    s.onload = function () {
      var lib = window.pdfjsLib;
      lib.GlobalWorkerOptions.workerSrc = "/lib/pdf.worker.min.js";
      lib.getDocument({ url: adresse, disableAutoFetch: true }).promise.then(function (pdf) {
        zone.textContent = "";
        var largeur = Math.min(zone.clientWidth - 16, 900);
        var ratio = Math.min(window.devicePixelRatio || 1, 2);
        // Chaque page est dessinée quand elle arrive à l'écran : les gros
        // polycopiés s'ouvrent vite, même sur un petit téléphone.
        var observateur = new IntersectionObserver(function (entrees) {
          entrees.forEach(function (e) {
            if (!e.isIntersecting || e.target.dataset.fait) return;
            e.target.dataset.fait = "1";
            var n = +e.target.dataset.n;
            pdf.getPage(n).then(function (page) {
              var v1 = page.getViewport({ scale: 1 });
              var echelle = largeur / v1.width;
              var vue = page.getViewport({ scale: echelle * ratio });
              var c = document.createElement("canvas");
              c.width = vue.width; c.height = vue.height;
              e.target.insertBefore(c, e.target.firstChild);
              e.target.style.minHeight = "";
              page.render({ canvasContext: c.getContext("2d"), viewport: vue });
            });
          });
        }, { rootMargin: "800px 0px" });
        pdf.getPage(1).then(function (p1) {
          var v1 = p1.getViewport({ scale: 1 });
          var hauteur = Math.round(largeur * v1.height / v1.width);
          for (var n = 1; n <= pdf.numPages; n++) {
            var d = el("div", "page");
            d.dataset.n = n;
            d.style.minHeight = hauteur + "px";
            d.appendChild(el("span", null, n + " / " + pdf.numPages));
            zone.appendChild(d);
            observateur.observe(d);
          }
        });
      }).catch(function () {
        zone.textContent = "";
        var m = el("div", "message");
        m.appendChild(el("p", null, "Ce PDF n'a pas pu être affiché."));
        var b = el("button", "gros", "💾 Enregistrer le document");
        b.onclick = function () { document.getElementById("enregistrer").click(); };
        m.appendChild(b);
        zone.appendChild(m);
      });
    };
    s.onerror = nonLisible;
    document.head.appendChild(s);
  } else {
    nonLisible();
  }
})();
</script>
</body>
</html>
