# Site public et relais Internet (admin/site/). Même base et même stockage
# que le tableau de bord (wrangler.toml), sous un autre nom public.
name = "photocopie-benin"
main = "site/index.js"
compatibility_date = "2026-09-01"

# L'image d'aperçu des partages (WhatsApp, Facebook), servie telle quelle.
[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = true

# Nom de domaine du service (voir docs/nom-de-domaine.md). Vides tant qu'il
# n'existe pas : tout passe par l'adresse workers.dev ci-dessus.
#   ADRESSE_PUBLIQUE : mise dans les QR « Par Internet » et les liens du site.
#   ADRESSE_RELAIS   : où les PC des boutiques viennent chercher les commandes.
[vars]
ADRESSE_PUBLIQUE = ""
ADRESSE_RELAIS = ""

[[d1_databases]]
binding = "DB"
database_name = "photocopie-admin"
database_id = "db50c0ee-2e8e-4dfd-a98b-31c100c499e2"

[[r2_buckets]]
binding = "TELECHARGEMENTS"
bucket_name = "photocopie-telechargements"

# Pas de tâche planifiée : le compte a atteint la limite gratuite de 5.
# Le nettoyage du relais est déclenché par la visite des PC (voir
# `nettoyerSiBesoin` dans site/relais.js). Le gestionnaire `scheduled`
# reste en place pour le jour où une tâche planifiée sera possible.
[triggers]
crons = []
