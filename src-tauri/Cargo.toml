[package]
name = "photocopie-benin"
version = "0.4.19"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "photocopie-benin"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "photocopie_benin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
notify = "6"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.31"
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
local-ip-address = "0.6"
machine-uid = "0.5"
base64 = "0.22"
base32 = "0.5"
# Déjà présent dans l'arbre de dépendances via ed25519-dalek ; déclaré ici
# pour l'empreinte matérielle de la machine (voir license.rs).
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
dhcproto = "0.15.0"
hickory-proto = "0.26.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Devices_Bluetooth", "Devices_Bluetooth_Rfcomm", "Networking_Sockets", "Storage_Streams", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Printing", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Threading", "Win32_System_Registry", "Devices_WiFiDirect", "Security_Credentials", "Foundation"] }
winreg = "0.52"

[dev-dependencies]
tempfile = "3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
